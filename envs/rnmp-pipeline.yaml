# Ribose-Map runtime: SRA retrieval, trimming, alignment, rNMP coordinate calling.
#
# NOTE: Ribose-Map is NOT a conda package. It is cloned from GitHub and invoked as
#   ribose-map/modules/ribosemap {alignment,coordinate,composition,sequence,distribution,hotspot} <config>
# scripts/00_setup_reference.sh clones it and records the commit in
# data/reference/ribose-map.commit.
#
# This file replaces ribose-map/lib/ribosemap.yaml, which requests the retired `r`
# channel plus Anaconda `defaults` (restrictively licensed for many institutions)
# and pins umi_tools=1.0.0-0. Channels here are conda-forge + bioconda only.
#
# PLATFORM: every pin below was solved and smoke-tested on osx-arm64 (Apple
# Silicon, native -- no Rosetta) and is present for linux-64. Two pins are
# load-bearing for portability:
#   * sra-tools >= 3.2.1 -- 3.1.x has no osx-arm64 build at all
#   * trim-galore resolves from bioconda/noarch; the only osx-arm64
#     `trim-galore` entries are unrelated 2.x versions, so the noarch package is
#     the one that must win
name: rnmp-pipeline
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11

  # --- read trimming (paper Methods: Trim Galore, -q 15 --length 62) ---
  - trim-galore=0.6.10     # noarch
  - cutadapt               # unpinned: 0.6.10 is compatible with cutadapt 5.x
  # fastqc is deliberately NOT included. Trim Galore only invokes it with
  # --fastqc, which this pipeline never passes, and the bioconda package is a
  # Java wrapper that does not pull in a JRE -- so declaring it gives an
  # executable that fails with "Unable to locate a Java Runtime" while adding a
  # large dependency nothing uses. Add `fastqc` AND `openjdk` together if you
  # want QC reports.

  # --- alignment (paper Methods: Bowtie 2) ---
  - bowtie2=2.5.4
  - samtools=1.21
  - bedtools=2.31.1

  # --- Ribose-Map module internals ---
  - umi_tools=1.1.5        # UMI extract + dedup (ribose-seq libraries only)
  - seqtk=1.4              # barcode trimming in alignment.sh
  - mawk=1.3.4             # coordinate.sh strand arithmetic
  - coreutils
  - bc                     # alignment.sh duplication statistics

  # --- SRA retrieval ---
  - sra-tools=3.2.1
  - entrez-direct=24.0

  # --- R side of Ribose-Map (composition / sequence / distribution / hotspot) ---
  - r-base=4.3
  - r-ggplot2
  - r-ggseqlogo            # Fig 2 sequence logos
  - r-data.table
